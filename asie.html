<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أعلام وخرائط دول قارة آسيا (46 دولة)</title>
</head>
<body style="margin:0; padding:10px; background:transparent; font-family: Tahoma, sans-serif;">

  <div style="background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%); border: 3px solid #00695c; border-radius: 20px; padding: 20px; text-align: center; max-width: 760px; margin: 0 auto;">
    <div style="background: #00695c; color: white; padding: 12px 20px; border-radius: 15px; margin-bottom: 15px;">
      <h2 style="margin: 0; font-size: 22px; color: #fff;">🌏 مستكشف القارات: دول قارة آسيا (46 دولة)</h2>
      <p style="margin: 5px 0 0; font-size: 14px; color: #e0f2f1;">شاهد العلم والخريطة، واستمع للنطق الصحيح!</p>
    </div>

    <div id="as-start-area" style="padding: 20px 10px;">
      <div style="font-size: 65px; margin-bottom: 12px;">🕌🗺️🚩</div>
      <p style="font-size: 18px; color: #004d40; font-weight: bold; margin-bottom: 18px;">تضم قارة آسيا 46 دولة! اختر التحدي المناسب لك:</p>
      <div style="display: flex; flex-direction: column; gap: 12px; max-width: 400px; margin: 0 auto;">
        <button type="button" id="as-start-15" style="background: #00897b; color: white; border: none; padding: 14px 25px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;">🚀 جولة سريعة (15 دولة عشوائية)</button>
        <button type="button" id="as-start-46" style="background: #004d40; color: white; border: none; padding: 14px 25px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;">🏆 التحدي الشامل (كل الـ 46 دولة)</button>
      </div>
    </div>

    <div id="as-play-wrapper" style="display: none;">
      <div style="display: flex; justify-content: space-between; background: #ffffff; padding: 10px 15px; border-radius: 12px; margin-bottom: 18px; font-weight: bold; border: 2px solid #4db6ac;">
        <span id="as-progress" style="color: #004d40;">السؤال: 1 / 15</span>
        <span id="as-score" style="color: #e65100;">النقاط: 0 ⭐</span>
      </div>

      <div id="as-quiz-area">
        <div style="display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; margin-bottom: 14px;">
          <div style="background: #ffffff; padding: 8px; border-radius: 14px; border: 2px solid #80cbc4; width: 170px;">
            <div style="font-size: 12px; font-weight: bold; color: #00695c; margin-bottom: 5px;">🚩 علم الدولة</div>
            <img id="as-flag-img" src="" alt="علم الدولة" style="width: 155px; height: 105px; object-fit: cover; border-radius: 8px; border: 1px solid #eee;">
          </div>
          <div style="background: #ffffff; padding: 8px; border-radius: 14px; border: 2px solid #81c784; width: 170px;">
            <div style="font-size: 12px; font-weight: bold; color: #2e7d32; margin-bottom: 5px;">🗺️ خريطة الدولة</div>
            <img id="as-map-img" src="" alt="خريطة الدولة" style="width: 105px; height: 105px; object-fit: contain;">
          </div>
        </div>
        <button type="button" id="as-speak-btn" style="background: #0277bd; color: white; border: none; padding: 9px 22px; font-size: 16px; font-weight: bold; border-radius: 20px; cursor: pointer; margin-bottom: 10px;">🔊 استمع للسؤال</button>
        <h3 style="font-size: 20px; color: #004d40; margin: 5px 0 16px;">ما اسم هذه الدولة الآسيوية؟</h3>
        <div id="as-options" style="display: grid; grid-template-columns: 1fr; gap: 11px; max-width: 500px; margin: 0 auto;"></div>
        <div id="as-feedback" style="margin-top: 15px; font-size: 17px; font-weight: bold; padding: 8px; border-radius: 10px;"></div>
        <button type="button" id="as-next-btn" style="display: none; margin: 14px auto 0; background: #00695c; color: white; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer;">الدولة التالية ⬅️</button>
      </div>

      <div id="as-result-area" style="display: none; padding: 20px;">
        <div style="font-size: 65px; margin-bottom: 10px;">🏆</div>
        <h3 style="font-size: 24px; color: #004d40;">أحسنت يا مستكشف آسيا!</h3>
        <p id="as-final-score" style="font-size: 20px; font-weight: bold; color: #e65100; margin-bottom: 20px;"></p>
        <button type="button" id="as-restart-btn" style="background: #00897b; color: white; border: none; padding: 14px 32px; font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer;">🔄 العودة للقائمة الرئيسية</button>
      </div>
    </div>
  </div>

  <script>
    var rawAsia = "ps:فلسطين|sa:السعودية|ae:الإمارات|qa:قطر|kw:الكويت|bh:البحرين|om:سلطنة عُمان|ye:اليمن|jo:الأردن|lb:لبنان|sy:سوريا|iq:العراق|tr:تركيا|ir:إيران|af:أفغانستان|pk:باكستان|in:الهند|bd:بنغلاديش|lk:سريلانكا|np:نيبال|bt:بوتان|mv:المالديف|kz:كازاخستان|uz:أوزبكستان|tm:تركمانستان|kg:قيرغيزستان|tj:طاجيكستان|az:أذربيجان|ge:جورجيا|am:أرمينيا|cn:الصين|jp:اليابان|kr:كوريا الجنوبية|kp:كوريا الشمالية|mn:منغوليا|id:إندونيسيا|my:ماليزيا|sg:سنغافورة|th:تايلاند|vn:فيتنام|ph:الفلبين|kh:كمبوديا|la:لاوس|mm:ميانمار|bn:بروناي|tl:تيمور الشرقية";
    var allAsiaCountries = rawAsia.split("|").map(function(item) { var parts = item.split(":"); return { code: parts.shift(), name: parts.shift() }; });
    var gameList = new Array(), currentCountry = null, totalCount = 0, asIdx = 0, asScore = 0, asAnswered = false, sharedAudioCtx = null;
    function shuffleArray(arr) { return arr.slice().sort(function() { return Math.random() - 0.5; }); }
    function getAudioCtx() {
      if (!sharedAudioCtx) { var AudioCtx = window.AudioContext || window.webkitAudioContext; if (AudioCtx) sharedAudioCtx = new AudioCtx(); }
      if (sharedAudioCtx && sharedAudioCtx.state === "suspended") { sharedAudioCtx.resume(); }
      return sharedAudioCtx;
    }
    function playTone(type) {
      try {
        var ctx = getAudioCtx(); if (!ctx) return;
        var osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        var now = ctx.currentTime;
        if (type === "win") {
          osc.type = "sine"; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.1); osc.frequency.setValueAtTime(783.99, now + 0.2); osc.frequency.setValueAtTime(1046.50, now + 0.3);
          gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55); osc.start(now); osc.stop(now + 0.55);
        } else if (type === "lose") {
          osc.type = "triangle"; osc.frequency.setValueAtTime(240, now); osc.frequency.setValueAtTime(175, now + 0.18);
          gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45); osc.start(now); osc.stop(now + 0.45);
        } else {
          osc.type = "sine"; osc.frequency.setValueAtTime(440, now);
          gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15); osc.start(now); osc.stop(now + 0.15);
        }
      } catch (e) {}
    }
    if ("speechSynthesis" in window) { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); }; }
    function speakArabic(text) {
      playTone("click");
      try {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          var msg = new SpeechSynthesisUtterance(text);
          var voices = window.speechSynthesis.getVoices();
          var arVoice = voices.find(function(v) { return v.lang && v.lang.toLowerCase().indexOf("ar") !== -1; });
          if (arVoice) { msg.voice = arVoice; msg.lang = arVoice.lang; } else { msg.lang = "ar"; }
          msg.rate = 0.9; window.speechSynthesis.speak(msg);
        }
      } catch (e) {}
    }
    function startAsiaGame(count) {
      gameList = shuffleArray(allAsiaCountries).slice(0, count); totalCount = gameList.length; asIdx = 0; asScore = 0;
      document.getElementById("as-score").innerHTML = "النقاط: 0 ⭐";
      document.getElementById("as-start-area").style.display = "none";
      document.getElementById("as-result-area").style.display = "none";
      document.getElementById("as-quiz-area").style.display = "block";
      document.getElementById("as-play-wrapper").style.display = "block";
      speakArabic("هيا نتعرف على دول قارة آسيا!");
      asLoad();
    }
    document.getElementById("as-start-15").addEventListener("click", function() { startAsiaGame(15); });
    document.getElementById("as-start-46").addEventListener("click", function() { startAsiaGame(46); });
    document.getElementById("as-speak-btn").addEventListener("click", function() { speakArabic("ما اسم هذه الدولة الآسيوية؟"); });
    function asLoad() {
      asAnswered = false;
      document.getElementById("as-feedback").innerHTML = "";
      document.getElementById("as-feedback").style.background = "transparent";
      document.getElementById("as-next-btn").style.display = "none";
      currentCountry = gameList.pop(); asIdx++;
      document.getElementById("as-progress").innerHTML = "السؤال: " + asIdx + " / " + totalCount;
      document.getElementById("as-flag-img").src = "https://" + "flagcdn.com" + "/w320/" + currentCountry.code + ".png";
      document.getElementById("as-map-img").src = "https://" + "raw." + "githubusercontent.com" + "/djaiss/mapsicon/master/all/" + currentCountry.code + "/256.png";
      var others = shuffleArray(allAsiaCountries.filter(function(c) { return c.code !== currentCountry.code; }));
      var options = shuffleArray(new Array(currentCountry, others.pop(), others.pop()));
      var optBox = document.getElementById("as-options"); optBox.innerHTML = "";
      options.forEach(function(optObj) {
        var btn = document.createElement("button"); btn.type = "button"; btn.innerHTML = "🔊 " + optObj.name; btn.dataset.code = optObj.code;
        btn.style.cssText = "background:#ffffff; border:2px solid #4db6ac; border-radius:15px; padding:13px 18px; font-size:19px; font-weight:bold; color:#004d40; cursor:pointer;";
        btn.addEventListener("click", function() { speakArabic(optObj.name); asCheck(optObj.code === currentCountry.code, btn, currentCountry); });
        optBox.appendChild(btn);
      });
    }
    function asCheck(isCorrect, btn, cur) {
      if (asAnswered) return; asAnswered = true;
      var btns = document.getElementById("as-options").querySelectorAll("button"), fb = document.getElementById("as-feedback");
      if (isCorrect) {
        asScore++; playTone("win"); document.getElementById("as-score").innerHTML = "النقاط: " + asScore + " ⭐";
        btn.style.background = "#c8e6c9"; btn.style.borderColor = "#2e7d32";
        fb.innerHTML = "🎉 ممتاز! هذه دولة " + cur.name; fb.style.background = "#e8f5e9"; fb.style.color = "#1b5e20";
        setTimeout(function() { speakArabic("ممتاز! هذه دولة " + cur.name); }, 600);
      } else {
        playTone("lose"); btn.style.background = "#ffcdd2"; btn.style.borderColor = "#c62828";
        btns.forEach(function(b) { if (b.dataset.code === cur.code) { b.style.background = "#c8e6c9"; b.style.borderColor = "#2e7d32"; } });
        fb.innerHTML = "❌ إجابة خاطئة! الإجابة الصحيحة هي: " + cur.name; fb.style.background = "#ffebee"; fb.style.color = "#c62828";
        setTimeout(function() { speakArabic("الإجابة الصحيحة هي " + cur.name); }, 600);
      }
      var next = document.getElementById("as-next-btn"); next.style.display = "inline-block";
      next.innerHTML = (gameList.length === 0) ? "عرض النتيجة النهائية 🏆" : "الدولة التالية ⬅️";
    }
    document.getElementById("as-next-btn").addEventListener("click", function() {
      if (gameList.length > 0) { asLoad(); } else {
        document.getElementById("as-quiz-area").style.display = "none"; document.getElementById("as-result-area").style.display = "block";
        document.getElementById("as-final-score").innerHTML = "لقد حصلت على " + asScore + " من " + totalCount + " نجوم! ⭐";
        playTone("win"); speakArabic("أحسنت يا بطل! لقد حصلت على " + asScore + " من " + totalCount + " نجوم");
      }
    });
    document.getElementById("as-restart-btn").addEventListener("click", function() {
      document.getElementById("as-play-wrapper").style.display = "none"; document.getElementById("as-start-area").style.display = "block";
    });
  </script>
</body>
</html>
