  <script>
    var rawEurope = "fr:فرنسا|es:إسبانيا|pt:البرتغال|it:إيطاليا|de:ألمانيا|gb:المملكة المتحدة|ie:أيرلندا|nl:هولندا|be:بلجيكا|lu:لوكسمبورغ|ch:سويسرا|at:النمسا|pl:بولندا|cz:التشيك|sk:سلوفاكيا|hu:المجر|ro:رومانيا|bg:بلغاريا|gr:اليونان|se:السويد|no:النرويج|fi:فنلندا|dk:الدنمارك|is:آيسلندا|ee:إستونيا|lv:لاتفيا|lt:ليتوانيا|ua:أوكرانيا|by:بيلاروسيا|md:مولدوفا|hr:كرواتيا|si:سلوفينيا|ba:البوسنة والهرسك|rs:صربيا|me:الجبل الأسود|mk:مقدونيا الشمالية|al:ألبانيا|ru:روسيا|mt:مالطا|cy:قبرص|ad:أندورا|mc:موناكو|sm:سان مارينو|li:ليختنشتاين";

    var allEuropeCountries = rawEurope.split("|").map(function(item) {
      var parts = item.split(":");
      return { code: parts.shift(), name: parts.shift() };
    });

    var gameList = new Array();
    var currentCountry = null;
    var totalCount = 0;
    var euIdx = 0;
    var euScore = 0;
    var euAnswered = false;
    var sharedAudioCtx = null;

    function shuffleArray(arr) {
      return arr.slice().sort(function() { return Math.random() - 0.5; });
    }

    function getAudioCtx() {
      if (!sharedAudioCtx) {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) sharedAudioCtx = new AudioCtx();
      }
      if (sharedAudioCtx && sharedAudioCtx.state === "suspended") {
        sharedAudioCtx.resume();
      }
      return sharedAudioCtx;
    }

    function playTone(type) {
      try {
        var ctx = getAudioCtx();
        if (!ctx) return;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        var now = ctx.currentTime;

        if (type === "win") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          osc.frequency.setValueAtTime(1046.50, now + 0.3);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          osc.start(now);
          osc.stop(now + 0.55);
        } else if (type === "lose") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.setValueAtTime(175, now + 0.18);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        } else {
          osc.type = "sine";
          osc.frequency.setValueAtTime(440, now);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        }
      } catch (e) {}
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = function() {
        window.speechSynthesis.getVoices();
      };
    }

    function speakArabic(text) {
      playTone("click");
      try {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          var msg = new SpeechSynthesisUtterance(text);
          var voices = window.speechSynthesis.getVoices();
          var arVoice = voices.find(function(v) { return v.lang && v.lang.toLowerCase().indexOf("ar") !== -1; });
          if (arVoice) {
            msg.voice = arVoice;
            msg.lang = arVoice.lang;
          } else {
            msg.lang = "ar";
          }
          msg.rate = 0.9;
          window.speechSynthesis.speak(msg);
        }
      } catch (e) {}
    }

    function startEuropeGame(count) {
      gameList = shuffleArray(allEuropeCountries).slice(0, count);
      totalCount = gameList.length;
      euIdx = 0;
      euScore = 0;
      document.getElementById("eu-score").innerHTML = "النقاط: 0 ⭐";
      document.getElementById("eu-start-area").style.display = "none";
      document.getElementById("eu-result-area").style.display = "none";
      document.getElementById("eu-quiz-area").style.display = "block";
      document.getElementById("eu-play-wrapper").style.display = "block";
      speakArabic("هيا نتعرف على دول قارة أوروبا!");
      euLoad();
    }

    document.getElementById("eu-start-15").addEventListener("click", function() { startEuropeGame(15); });
    document.getElementById("eu-start-44").addEventListener("click", function() { startEuropeGame(44); });
    document.getElementById("eu-speak-btn").addEventListener("click", function() { speakArabic("ما اسم هذه الدولة الأوروبية؟"); });

    function euLoad() {
      euAnswered = false;
      document.getElementById("eu-feedback").innerHTML = "";
      document.getElementById("eu-feedback").style.background = "transparent";
      document.getElementById("eu-next-btn").style.display = "none";

      currentCountry = gameList.pop();
      euIdx++;
      document.getElementById("eu-progress").innerHTML = "السؤال: " + euIdx + " / " + totalCount;
      
      var flagUrl = "https://" + "flagcdn.com" + "/w320/" + currentCountry.code + ".png";
      var mapUrl = "https://" + "raw." + "githubusercontent.com" + "/djaiss/mapsicon/master/all/" + currentCountry.code + "/256.png";
      document.getElementById("eu-flag-img").src = flagUrl;
      document.getElementById("eu-map-img").src = mapUrl;

      var others = shuffleArray(allEuropeCountries.filter(function(c) { return c.code !== currentCountry.code; }));
      var wrong1 = others.pop();
      var wrong2 = others.pop();
      var options = shuffleArray(new Array(currentCountry, wrong1, wrong2));

      var optBox = document.getElementById("eu-options");
      optBox.innerHTML = "";

      options.forEach(function(optObj) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.innerHTML = "🔊 " + optObj.name;
        btn.dataset.code = optObj.code;
        btn.style.cssText = "background:#ffffff; border:2px solid #64b5f6; border-radius:15px; padding:13px 18px; font-size:19px; font-weight:bold; color:#0d47a1; cursor:pointer;";
        btn.addEventListener("click", function() {
          speakArabic(optObj.name);
          euCheck(optObj.code === currentCountry.code, btn, currentCountry);
        });
        optBox.appendChild(btn);
      });
    }

    function euCheck(isCorrect, btn, cur) {
      if (euAnswered) return;
      euAnswered = true;
      var btns = document.getElementById("eu-options").querySelectorAll("button");
      var fb = document.getElementById("eu-feedback");

      if (isCorrect) {
        euScore++;
        playTone("win");
        document.getElementById("eu-score").innerHTML = "النقاط: " + euScore + " ⭐";
        btn.style.background = "#c8e6c9";
        btn.style.borderColor = "#2e7d32";
        fb.innerHTML = "🎉 ممتاز! هذه دولة " + cur.name;
        fb.style.background = "#e8f5e9";
        fb.style.color = "#1b5e20";
        setTimeout(function() { speakArabic("ممتاز! هذه دولة " + cur.name); }, 600);
      } else {
        playTone("lose");
        btn.style.background = "#ffcdd2";
        btn.style.borderColor = "#c62828";
        btns.forEach(function(b) {
          if (b.dataset.code === cur.code) {
            b.style.background = "#c8e6c9";
            b.style.borderColor = "#2e7d32";
          }
        });
        fb.innerHTML = "❌ إجابة خاطئة! الإجابة الصحيحة هي: " + cur.name;
        fb.style.background = "#ffebee";
        fb.style.color = "#c62828";
        setTimeout(function() { speakArabic("الإجابة الصحيحة هي " + cur.name); }, 600);
      }

      var next = document.getElementById("eu-next-btn");
      next.style.display = "inline-block";
      next.innerHTML = (gameList.length === 0) ? "عرض النتيجة النهائية 🏆" : "الدولة التالية ⬅️";
    }

    document.getElementById("eu-next-btn").addEventListener("click", function() {
      if (gameList.length > 0) {
        euLoad();
      } else {
        document.getElementById("eu-quiz-area").style.display = "none";
        document.getElementById("eu-result-area").style.display = "block";
        document.getElementById("eu-final-score").innerHTML = "لقد حصلت على " + euScore + " من " + totalCount + " نجوم! ⭐";
        playTone("win");
        speakArabic("أحسنت يا بطل! لقد حصلت على " + euScore + " من " + totalCount + " نجوم");
      }
    });

    document.getElementById("eu-restart-btn").addEventListener("click", function() {
      document.getElementById("eu-play-wrapper").style.display = "none";
      document.getElementById("eu-start-area").style.display = "block";
    });
  </script>
</body>
</html>
